name: Deploy GaC-Srtool to GitHub Pages

# GitHub is a one-way mirror of the Gitea repository, so nothing here may
# commit: a commit made on GitHub would be erased by the next mirror push.
# Instead the game data is refreshed inside the build, just before the site is
# uploaded. The daily schedule therefore publishes new characters, light
# cones, relic sets, builds and endgame rooms without touching the repository
# and without any secrets.
on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Vercel only builds when something is pushed, so the daily schedule asks it
  # to rebuild through a Deploy Hook; the Vercel build then refreshes the game
  # data itself (scripts/build-vercel.cjs). Skipped until the
  # VERCEL_DEPLOY_HOOK secret exists. The hook URL can only start a rebuild.
  vercel:
    if: github.event_name != 'push' && github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    env:
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - name: Ask Vercel to rebuild
        if: env.VERCEL_DEPLOY_HOOK != ''
        run: curl --fail --silent --show-error -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null

  deploy:
    # GitHub only: the copy of this file on Gitea must not try to deploy
    # GitHub Pages.
    if: github.ref == 'refs/heads/main' && github.server_url == 'https://github.com'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # Each source is refreshed on its own, so one that is down or refuses
      # the request only keeps its own data at the committed version (these
      # scripts write only on success). Order matters: sync-data reads the
      # usage statistics and hashes the endgame catalog.
      - name: Refresh game data
        run: |
          node scripts/sync-build-guides.mjs \
            || echo "::warning::Usage statistics not refreshed; keeping the committed version."
          node scripts/build-firefly-endgame-data.cjs "$RUNNER_TEMP/endgame-cache" \
            || echo "::warning::Endgame rooms not refreshed; keeping the committed version."
          if node scripts/sync-data.mjs && node --test tests/*.test.cjs; then
            echo "Game data refreshed."
          else
            echo "::warning::Game data refresh failed; publishing the committed data instead."
            git checkout -- .
            git clean -fdq assets/data
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Generate deployment branch metadata
        env:
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          node -e 'const fs = require("node:fs"); const data = { branch: process.env.DEPLOY_BRANCH, version: "1.0.0", updatedAt: new Date().toISOString() }; fs.writeFileSync("version.json", JSON.stringify(data, null, 2) + "\n");'
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
